<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Koi sprite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.koi2-tail{transform-origin:13px 11.5px;animation:koi2Wag 1.1s steps(5) infinite alternate}
.koi2-fin-t{transform-origin:28px 5px;animation:koi2FinT .9s steps(3) infinite alternate}
.koi2-fin-b{transform-origin:28px 18px;animation:koi2FinB .9s steps(3) infinite alternate}
.koi2-still{animation:none}
.koi2-drift{animation:koi2Drift 7s ease-in-out infinite}
@keyframes koi2Wag{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes koi2FinT{from{transform:rotate(-16deg)}to{transform:rotate(10deg)}}
@keyframes koi2FinB{from{transform:rotate(16deg)}to{transform:rotate(-10deg)}}
@keyframes koi2Drift{0%,100%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(4px,-2px) rotate(-3deg)}60%{transform:translate(7px,1px) rotate(2deg)}}
@media (prefers-reduced-motion: reduce){.koi2-tail,.koi2-fin-t,.koi2-fin-b,.koi2-drift{animation:none}}
</style>
</helmet>
<div class="{{driftClass}}" style="width: {{w}}px; height: {{h}}px; line-height: 0">
<svg width="{{w}}" height="{{h}}" viewBox="-1 -1 52 28" role="img" aria-label="{{label}}" style="shape-rendering: crispEdges; overflow: visible">
<defs>
<g id="koi2-b"><rect x="22" y="5" width="10" height="1"/><rect x="18" y="6" width="18" height="1"/><rect x="16" y="7" width="23" height="1"/><rect x="14" y="8" width="27" height="1"/><rect x="13" y="9" width="29" height="1"/><rect x="12" y="10" width="31" height="1"/><rect x="12" y="11" width="32" height="2"/><rect x="12" y="13" width="31" height="1"/><rect x="13" y="14" width="29" height="1"/><rect x="14" y="15" width="27" height="1"/><rect x="16" y="16" width="23" height="1"/><rect x="18" y="17" width="18" height="1"/><rect x="22" y="18" width="10" height="1"/></g>
<g id="koi2-t"><rect x="0" y="1" width="3" height="1"/><rect x="0" y="2" width="5" height="1"/><rect x="1" y="3" width="6" height="1"/><rect x="2" y="4" width="7" height="1"/><rect x="3" y="5" width="7" height="1"/><rect x="5" y="6" width="6" height="1"/><rect x="6" y="7" width="6" height="1"/><rect x="8" y="8" width="5" height="1"/><rect x="9" y="9" width="4" height="1"/><rect x="10" y="10" width="3" height="4"/><rect x="9" y="14" width="4" height="1"/><rect x="8" y="15" width="5" height="1"/><rect x="6" y="16" width="6" height="1"/><rect x="5" y="17" width="6" height="1"/><rect x="3" y="18" width="7" height="1"/><rect x="2" y="19" width="7" height="1"/><rect x="1" y="20" width="6" height="1"/><rect x="0" y="21" width="5" height="1"/><rect x="0" y="22" width="3" height="1"/></g>
<g id="koi2-ft"><rect x="26" y="1" width="3" height="1"/><rect x="26" y="2" width="5" height="1"/><rect x="27" y="3" width="5" height="1"/><rect x="28" y="4" width="4" height="1"/></g>
<g id="koi2-fb"><rect x="28" y="19" width="4" height="1"/><rect x="27" y="20" width="5" height="1"/><rect x="26" y="21" width="5" height="1"/><rect x="26" y="22" width="3" height="1"/></g>
<g id="koi2-p"><rect x="19" y="3" width="2" height="1"/><rect x="19" y="4" width="3" height="1"/><rect x="19" y="19" width="3" height="1"/><rect x="19" y="20" width="2" height="1"/></g>
<pattern id="koi2-check" width="2" height="2" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="1" height="1" fill="#000"/><rect x="1" y="1" width="1" height="1" fill="#000"/></pattern>
<pattern id="koi2-scale" width="4" height="2" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="1" height="1" fill="#fff"/><rect x="2" y="1" width="1" height="1" fill="#fff"/></pattern>
<clipPath id="koi2-clip"><use href="#koi2-b"/></clipPath>
</defs>

<g transform="translate(2 3)" fill="#06141A" opacity="0.4"><use href="#koi2-b"/><use href="#koi2-t"/><use href="#koi2-ft"/><use href="#koi2-fb"/></g>

<g class="{{tailClass}}">
<g fill="{{c.ol}}" opacity="0.7"><use href="#koi2-t" x="-1"/><use href="#koi2-t" x="1"/><use href="#koi2-t" y="-1"/><use href="#koi2-t" y="1"/></g>
<use href="#koi2-t" fill="{{c.f1}}"/>
<g fill="{{c.f2}}"><rect x="0" y="1" width="3" height="1"/><rect x="0" y="22" width="3" height="1"/><rect x="0" y="2" width="2" height="1"/><rect x="2" y="3" width="2" height="1"/><rect x="4" y="4" width="2" height="1"/><rect x="6" y="5" width="2" height="1"/><rect x="8" y="6" width="2" height="1"/><rect x="0" y="21" width="2" height="1"/><rect x="2" y="20" width="2" height="1"/><rect x="4" y="19" width="2" height="1"/><rect x="6" y="18" width="2" height="1"/><rect x="8" y="17" width="2" height="1"/><rect x="5" y="11" width="0" height="0"/></g>
<g fill="{{c.o1}}"><rect x="10" y="9" width="3" height="6"/><rect x="9" y="10" width="1" height="4"/></g>
<g fill="{{c.o2}}"><rect x="10" y="13" width="3" height="2"/></g>
</g>

<g fill="{{c.ol}}" opacity="0.7"><use href="#koi2-p" x="-1"/><use href="#koi2-p" x="1"/><use href="#koi2-p" y="-1"/><use href="#koi2-p" y="1"/></g>
<use href="#koi2-p" fill="{{c.f1}}"/>
<g fill="{{c.f2}}"><rect x="19" y="3" width="2" height="1"/><rect x="19" y="20" width="2" height="1"/></g>

<g class="{{finTClass}}">
<g fill="{{c.ol}}" opacity="0.7"><use href="#koi2-ft" x="-1"/><use href="#koi2-ft" x="1"/><use href="#koi2-ft" y="-1"/><use href="#koi2-ft" y="1"/></g>
<use href="#koi2-ft" fill="{{c.f1}}"/>
<g fill="{{c.f2}}"><rect x="26" y="1" width="3" height="1"/><rect x="27" y="2" width="1" height="1"/><rect x="29" y="3" width="1" height="1"/></g>
</g>
<g class="{{finBClass}}">
<g fill="{{c.ol}}" opacity="0.7"><use href="#koi2-fb" x="-1"/><use href="#koi2-fb" x="1"/><use href="#koi2-fb" y="-1"/><use href="#koi2-fb" y="1"/></g>
<use href="#koi2-fb" fill="{{c.f1}}"/>
<g fill="{{c.f2}}"><rect x="26" y="22" width="3" height="1"/><rect x="27" y="21" width="1" height="1"/><rect x="29" y="20" width="1" height="1"/></g>
</g>

<g fill="{{c.ol}}"><use href="#koi2-b" x="-1"/><use href="#koi2-b" x="1"/><use href="#koi2-b" y="-1"/><use href="#koi2-b" y="1"/></g>
<use href="#koi2-b" fill="{{c.w1}}"/>

<g fill="{{c.w2}}"><rect x="16" y="16" width="23" height="1"/><rect x="18" y="17" width="18" height="1"/><rect x="22" y="18" width="10" height="1"/><rect x="12" y="13" width="2" height="1"/><rect x="13" y="14" width="2" height="1"/><rect x="42" y="12" width="1" height="2"/></g>
<rect x="13" y="14" width="29" height="1" fill="url(#koi2-check)" opacity="0.18"/>
<rect x="14" y="15" width="27" height="1" fill="url(#koi2-check)" opacity="0.28"/>
<g fill="{{c.hl}}"><rect x="19" y="6" width="6" height="1"/><rect x="17" y="7" width="4" height="1"/><rect x="15" y="8" width="3" height="1"/><rect x="41" y="10" width="1" height="1"/><rect x="42" y="11" width="1" height="1"/></g>

<g fill="{{c.o1}}">
<rect x="33" y="7" width="5" height="1"/><rect x="32" y="8" width="8" height="1"/><rect x="32" y="9" width="9" height="1"/><rect x="33" y="10" width="8" height="1"/><rect x="34" y="11" width="7" height="2"/><rect x="33" y="13" width="8" height="1"/><rect x="32" y="14" width="8" height="1"/><rect x="32" y="15" width="7" height="1"/><rect x="33" y="16" width="4" height="1"/>
<rect x="22" y="5" width="8" height="1"/><rect x="20" y="6" width="12" height="1"/><rect x="18" y="7" width="13" height="1"/><rect x="17" y="8" width="13" height="1"/><rect x="18" y="9" width="11" height="1"/><rect x="20" y="10" width="8" height="1"/><rect x="22" y="11" width="5" height="1"/>
<rect x="24" y="14" width="6" height="1"/><rect x="23" y="15" width="8" height="1"/><rect x="24" y="16" width="6" height="1"/><rect x="25" y="17" width="4" height="1"/>
<rect x="14" y="9" width="4" height="1"/><rect x="13" y="10" width="6" height="1"/><rect x="13" y="11" width="7" height="1"/><rect x="13" y="12" width="6" height="1"/><rect x="14" y="13" width="4" height="1"/>
</g>
<g fill="{{c.o2}}"><rect x="32" y="15" width="7" height="1"/><rect x="33" y="16" width="4" height="1"/><rect x="38" y="13" width="3" height="2"/><rect x="20" y="10" width="8" height="1"/><rect x="22" y="11" width="5" height="1"/><rect x="24" y="16" width="6" height="1"/><rect x="25" y="17" width="4" height="1"/><rect x="13" y="12" width="6" height="1"/><rect x="14" y="13" width="4" height="1"/></g>
<g fill="{{c.o3}}"><rect x="33" y="7" width="3" height="1"/><rect x="32" y="8" width="3" height="1"/><rect x="22" y="5" width="5" height="1"/><rect x="20" y="6" width="4" height="1"/><rect x="18" y="7" width="3" height="1"/><rect x="24" y="14" width="3" height="1"/><rect x="14" y="9" width="3" height="1"/></g>
<g clip-path="url(#koi2-clip)"><rect x="12" y="5" width="32" height="14" fill="url(#koi2-scale)" opacity="0.16"/></g>

<g fill="{{c.k}}"><rect x="36" y="8" width="2" height="1"/><rect x="36" y="15" width="2" height="1"/></g>
<g fill="{{c.hl}}"><rect x="37" y="8" width="1" height="1" opacity="0.8"/><rect x="37" y="15" width="1" height="1" opacity="0.8"/></g>
<g fill="{{c.f2}}"><rect x="44" y="10" width="1" height="1"/><rect x="44" y="13" width="1" height="1"/><rect x="45" y="9" width="1" height="1"/><rect x="45" y="14" width="1" height="1"/></g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scale":{"editor":"int","default":4,"min":1,"max":10},"variant":{"editor":"enum","default":"kohaku","options":["kohaku","yamabuki","showa","kumonryu"]},"swim":{"editor":"boolean","default":false},"wag":{"editor":"boolean","default":true},"$preview":{"width":208,"height":112}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.scale ?? 4;
const palettes = {
kohaku: { w1: '#FFF6E8', w2: '#D9CDBA', hl: '#FFFFFF', o1: '#F06A2A', o2: '#B8401F', o3: '#FF9A55', f1: '#F4D9BC', f2: '#D9A57A', k: '#14232A', ol: '#3A2018' },
yamabuki: { w1: '#F7C948', w2: '#C9952A', hl: '#FFF0A8', o1: '#E89A2A', o2: '#B4701C', o3: '#FFE08A', f1: '#F7DFA0', f2: '#D9AE5A', k: '#14232A', ol: '#4A3010' },
showa: { w1: '#FFF6E8', w2: '#CFC3B0', hl: '#FFFFFF', o1: '#E0502A', o2: '#1C2226', o3: '#FF8450', f1: '#E9DCCB', f2: '#2A3338', k: '#0B1418', ol: '#0B1418' },
kumonryu: { w1: '#E9EEF0', w2: '#B5C0C4', hl: '#FFFFFF', o1: '#24323A', o2: '#0E181D', o3: '#4A5E68', f1: '#C8D2D6', f2: '#6F7F86', k: '#0B1418', ol: '#121C21' }
};
const variant = this.props.variant ?? 'kohaku';
const wag = this.props.wag ?? true;
return {
w: 52 * s,
h: 28 * s,
c: palettes[variant] ?? palettes.kohaku,
label: variant + ' koi',
tailClass: wag ? 'koi2-tail' : 'koi2-still',
finTClass: wag ? 'koi2-fin-t' : 'koi2-still',
finBClass: wag ? 'koi2-fin-b' : 'koi2-still',
driftClass: (this.props.swim ?? false) ? 'koi2-drift' : ''
};
}
}
</script>
</body>
</html>
