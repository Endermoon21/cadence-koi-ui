<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Turntable sprite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.vin-spin{transform-origin:16px 17px;animation:vinSpin 1.6s steps(8) infinite}
.vin-still{animation:none}
@keyframes vinSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.vin-spin{animation:none}}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; line-height: 0">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 34" role="img" aria-label="{{label}}" style="shape-rendering: crispEdges">
<defs>
<g id="vin-disc"><rect x="13" y="1" width="6" height="1"/><rect x="11" y="2" width="10" height="1"/><rect x="8" y="3" width="16" height="1"/><rect x="7" y="4" width="18" height="1"/><rect x="6" y="5" width="20" height="1"/><rect x="5" y="6" width="22" height="1"/><rect x="4" y="7" width="24" height="1"/><rect x="3" y="8" width="26" height="1"/><rect x="2" y="9" width="28" height="3"/><rect x="1" y="12" width="30" height="4"/><rect x="0" y="16" width="32" height="2"/><rect x="1" y="18" width="30" height="4"/><rect x="2" y="22" width="28" height="3"/><rect x="3" y="25" width="26" height="1"/><rect x="4" y="26" width="24" height="1"/><rect x="5" y="27" width="22" height="1"/><rect x="6" y="28" width="20" height="1"/><rect x="7" y="29" width="18" height="1"/><rect x="8" y="30" width="16" height="1"/><rect x="11" y="31" width="10" height="1"/><rect x="13" y="32" width="6" height="1"/></g>
</defs>
<use href="#vin-disc" x="1" y="1" fill="#06141A" opacity="0.5"/>
<use href="#vin-disc" fill="#101A1F"/>
<g fill="#18262C"><rect x="4" y="16" width="1" height="2"/><rect x="27" y="16" width="1" height="2"/><rect x="15" y="4" width="2" height="1"/><rect x="15" y="30" width="2" height="1"/><rect x="7" y="9" width="1" height="1"/><rect x="24" y="25" width="1" height="1"/><rect x="24" y="9" width="1" height="1"/><rect x="7" y="25" width="1" height="1"/></g>
<g fill="#33464D"><rect x="6" y="12" width="1" height="2"/><rect x="7" y="11" width="1" height="1"/><rect x="10" y="8" width="1" height="1"/><rect x="11" y="7" width="2" height="1"/><rect x="9" y="12" width="1" height="2"/><rect x="10" y="11" width="1" height="1"/><rect x="11" y="10" width="2" height="1"/><rect x="25" y="20" width="1" height="2"/><rect x="24" y="22" width="1" height="1"/><rect x="21" y="25" width="1" height="1"/><rect x="19" y="26" width="2" height="1"/><rect x="22" y="20" width="1" height="2"/><rect x="21" y="22" width="1" height="1"/><rect x="19" y="23" width="2" height="1"/></g>
<g fill="#5E7A82"><rect x="8" y="10" width="1" height="1"/><rect x="9" y="9" width="1" height="1"/><rect x="13" y="1" width="6" height="1"/></g>

<g class="{{spinClass}}">
<g fill="{{labelColor}}"><rect x="14" y="11" width="4" height="1"/><rect x="13" y="12" width="6" height="1"/><rect x="12" y="13" width="8" height="1"/><rect x="11" y="14" width="10" height="2"/><rect x="10" y="16" width="12" height="2"/><rect x="11" y="18" width="10" height="2"/><rect x="12" y="20" width="8" height="1"/><rect x="13" y="21" width="6" height="1"/><rect x="14" y="22" width="4" height="1"/></g>
<g fill="{{labelShade}}"><rect x="16" y="18" width="5" height="2"/><rect x="16" y="20" width="4" height="1"/><rect x="16" y="21" width="3" height="1"/><rect x="16" y="22" width="2" height="1"/><rect x="20" y="16" width="2" height="2"/></g>
<g fill="#FFFFFF" opacity="0.45"><rect x="13" y="12" width="3" height="1"/><rect x="12" y="13" width="2" height="1"/></g>
<rect x="12" y="15" width="1" height="2" fill="#F4D9BC"/>
<rect x="13" y="15" width="4" height="1" fill="#F06A2A"/>
<rect x="13" y="16" width="3" height="1" fill="#FFF6E8"/>
<g fill="#0F2B33" opacity="0.55"><rect x="13" y="19" width="6" height="1"/><rect x="14" y="21" width="3" height="1"/></g>
</g>
<rect x="15" y="16" width="2" height="2" fill="#DDF3EC"/>
<rect x="16" y="17" width="1" height="1" fill="#8FB8B0"/>

<rect x="37" y="18" width="2" height="4" fill="#5D8580"/>
<g fill="#8FB8B0"><rect x="34" y="2" width="4" height="1"/><rect x="33" y="3" width="6" height="4"/><rect x="34" y="7" width="4" height="1"/></g>
<rect x="34" y="3" width="2" height="1" fill="#DDF3EC"/>
<rect x="33" y="6" width="6" height="1" fill="#5D8580"/>
<rect x="35" y="4" width="2" height="2" fill="#14232A"/>
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
<g fill="#B9D8D1"><rect x="35" y="7" width="1" height="2"/><rect x="34" y="9" width="1" height="1"/><rect x="33" y="10" width="1" height="1"/><rect x="32" y="11" width="1" height="1"/><rect x="31" y="12" width="1" height="1"/><rect x="29" y="13" width="2" height="1"/><rect x="28" y="14" width="1" height="1"/></g>
<rect x="25" y="14" width="3" height="2" fill="#DDF3EC"/>
<rect x="25" y="15" width="1" height="1" fill="#F4A640"/>
</sc-if>
<sc-if value="{{parked}}" hint-placeholder-val="{{ false }}">
<rect x="36" y="7" width="1" height="12" fill="#B9D8D1"/>
<rect x="35" y="19" width="3" height="2" fill="#DDF3EC"/>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scale":{"editor":"int","default":4,"min":1,"max":10},"playing":{"editor":"boolean","default":true},"labelColor":{"editor":"color","default":"#4FE0C1","options":["#4FE0C1","#8AD47A","#F4A640"]},"$preview":{"width":160,"height":136}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.scale ?? 4;
const playing = this.props.playing ?? true;
const labelColor = this.props.labelColor ?? '#4FE0C1';
const shades = { '#4FE0C1': '#2E9C88', '#8AD47A': '#5FAF5A', '#F4A640': '#C47A22' };
return {
w: 40 * s,
h: 34 * s,
playing: playing,
parked: !playing,
spinClass: playing ? 'vin-spin' : 'vin-still',
labelColor: labelColor,
labelShade: shades[labelColor] ?? '#2E9C88',
label: playing ? 'Record spinning' : 'Record stopped'
};
}
}
</script>
</body>
</html>
