<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lotus pad sprite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.lily-bob{animation:lilyBob 3.2s steps(4) infinite alternate}
.lily-sway{transform-origin:7px 8px;animation:lilySway 2.6s steps(3) infinite alternate}
@keyframes lilyBob{from{transform:translate(0,0) rotate(-2deg)}to{transform:translate(0,3px) rotate(2deg)}}
@keyframes lilySway{from{transform:rotate(-6deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion: reduce){.lily-bob,.lily-sway{animation:none}}
</style>
</helmet>
<div class="{{bobClass}}" style="width: {{w}}px; height: {{h}}px; line-height: 0">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 24 25" aria-hidden="true" style="shape-rendering: crispEdges">
<defs>
<g id="lily-pad"><rect x="9" y="2" width="3" height="1"/><rect x="8" y="3" width="4" height="1"/><rect x="6" y="4" width="6" height="1"/><rect x="17" y="4" width="1" height="1"/><rect x="5" y="5" width="7" height="1"/><rect x="17" y="5" width="2" height="1"/><rect x="4" y="6" width="8" height="1"/><rect x="16" y="6" width="4" height="1"/><rect x="3" y="7" width="9" height="1"/><rect x="16" y="7" width="5" height="1"/><rect x="3" y="8" width="9" height="1"/><rect x="15" y="8" width="6" height="1"/><rect x="2" y="9" width="10" height="1"/><rect x="15" y="9" width="7" height="1"/><rect x="2" y="10" width="10" height="2"/><rect x="14" y="10" width="8" height="2"/><rect x="2" y="12" width="10" height="1"/><rect x="13" y="12" width="9" height="1"/><rect x="2" y="13" width="20" height="4"/><rect x="3" y="17" width="18" height="2"/><rect x="4" y="19" width="16" height="1"/><rect x="5" y="20" width="14" height="1"/><rect x="6" y="21" width="12" height="1"/><rect x="8" y="22" width="8" height="1"/><rect x="9" y="23" width="6" height="1"/></g>
</defs>
<use href="#lily-pad" x="1" y="1" fill="#06141A" opacity="0.4"/>
<use href="#lily-pad" fill="#5FAF5A"/>
<g fill="#3F8A43"><rect x="3" y="18" width="18" height="1"/><rect x="4" y="19" width="16" height="1"/><rect x="5" y="20" width="14" height="1"/><rect x="6" y="21" width="12" height="1"/><rect x="8" y="22" width="8" height="1"/><rect x="9" y="23" width="6" height="1"/><rect x="21" y="13" width="1" height="4"/><rect x="20" y="17" width="1" height="1"/><rect x="21" y="9" width="1" height="4"/></g>
<g fill="#8AD47A"><rect x="9" y="2" width="3" height="1"/><rect x="8" y="3" width="2" height="1"/><rect x="6" y="4" width="2" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="3" y="7" width="1" height="2"/><rect x="2" y="9" width="1" height="3"/><rect x="17" y="4" width="1" height="1"/><rect x="17" y="5" width="1" height="1"/></g>
<g fill="#A8E08F"><rect x="10" y="2" width="1" height="1"/><rect x="2" y="10" width="1" height="1"/></g>
<g fill="#4A9A48"><rect x="3" y="13" width="9" height="1"/><rect x="13" y="13" width="8" height="1"/><rect x="12" y="14" width="1" height="8"/><rect x="11" y="14" width="1" height="1"/><rect x="10" y="15" width="1" height="1"/><rect x="9" y="16" width="1" height="1"/><rect x="8" y="17" width="1" height="1"/><rect x="7" y="18" width="1" height="1"/><rect x="13" y="14" width="1" height="1"/><rect x="14" y="15" width="1" height="1"/><rect x="15" y="16" width="1" height="1"/><rect x="16" y="17" width="1" height="1"/><rect x="17" y="18" width="1" height="1"/><rect x="11" y="12" width="1" height="1"/><rect x="10" y="11" width="1" height="1"/><rect x="9" y="10" width="1" height="1"/><rect x="16" y="11" width="1" height="1"/><rect x="18" y="10" width="1" height="1"/></g>
<rect x="12" y="13" width="1" height="1" fill="#3F8A43"/>
<sc-if value="{{bloom}}" hint-placeholder-val="{{ true }}">
<rect x="5" y="9" width="6" height="1" fill="#3F8A43"/>
<g class="{{swayClass}}">
<g fill="#F7B8CF"><rect x="7" y="3" width="2" height="1"/><rect x="6" y="4" width="4" height="1"/><rect x="4" y="5" width="2" height="2"/><rect x="10" y="5" width="2" height="2"/><rect x="4" y="7" width="8" height="1"/></g>
<g fill="#FFE6EF"><rect x="7" y="4" width="1" height="1"/><rect x="6" y="5" width="4" height="2"/><rect x="4" y="5" width="1" height="1"/></g>
<g fill="#D9779A"><rect x="5" y="8" width="6" height="1"/><rect x="11" y="6" width="1" height="1"/><rect x="9" y="5" width="1" height="1"/></g>
<rect x="7" y="6" width="2" height="1" fill="#F4D35E"/>
<rect x="8" y="5" width="1" height="1" fill="#F4D35E"/>
</g>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scale":{"editor":"int","default":4,"min":1,"max":10},"bloom":{"editor":"boolean","default":true},"animate":{"editor":"boolean","default":true},"$preview":{"width":96,"height":100}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.scale ?? 4;
const a = this.props.animate ?? true;
return {
w: 24 * s,
h: 25 * s,
bloom: this.props.bloom ?? true,
bobClass: a ? 'lily-bob' : '',
swayClass: a ? 'lily-sway' : ''
};
}
}
</script>
</body>
</html>
