<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cassette sprite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tape-hub-l{transform-origin:14.5px 11.5px;animation:tapeSpin 1.2s steps(6) infinite}
.tape-hub-r{transform-origin:25.5px 11.5px;animation:tapeSpin .8s steps(6) infinite}
.tape-still{animation:none}
@keyframes tapeSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.tape-hub-l,.tape-hub-r{animation:none}}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; line-height: 0">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 26" role="img" aria-label="{{label}}" style="shape-rendering: crispEdges">
<g fill="#06141A" opacity="0.4"><rect x="2" y="2" width="38" height="24"/></g>
<rect x="1" y="0" width="38" height="1" fill="#B9D8D1"/>
<rect x="0" y="1" width="40" height="24" fill="#8FB8B0"/>
<rect x="1" y="25" width="38" height="1" fill="#5D8580"/>
<rect x="0" y="1" width="1" height="24" fill="#A9CCC5"/>
<rect x="39" y="1" width="1" height="24" fill="#5D8580"/>
<rect x="1" y="1" width="38" height="1" fill="#A9CCC5"/>
<g fill="#14232A"><rect x="2" y="2" width="1" height="1"/><rect x="37" y="2" width="1" height="1"/><rect x="2" y="23" width="1" height="1"/><rect x="37" y="23" width="1" height="1"/><rect x="19" y="23" width="2" height="1"/></g>
<rect x="3" y="3" width="34" height="14" fill="#DDF3EC"/>
<rect x="3" y="3" width="34" height="2" fill="#F4A640"/>
<rect x="3" y="4" width="34" height="1" fill="#C47A22"/>
<rect x="3" y="16" width="34" height="1" fill="#B9D8D1"/>
<g fill="#14232A"><rect x="6" y="8" width="1" height="1"/><rect x="5" y="9" width="1" height="3"/><rect x="7" y="9" width="1" height="3"/><rect x="6" y="10" width="1" height="1"/></g>
<g fill="#5E7A82"><rect x="9" y="6" width="5" height="1"/><rect x="15" y="6" width="3" height="1"/><rect x="19" y="6" width="7" height="1"/><rect x="27" y="6" width="2" height="1"/></g>
<rect x="31" y="8" width="1" height="2" fill="#F4D9BC"/>
<rect x="32" y="8" width="3" height="1" fill="#F06A2A"/>
<rect x="32" y="9" width="2" height="1" fill="#FFF6E8"/>
<rect x="10" y="7" width="20" height="8" fill="#B9D8D1"/>
<rect x="11" y="8" width="18" height="6" fill="#1F5560"/>
<rect x="11" y="8" width="18" height="1" fill="#2A6B78"/>
<g fill="#4A3326"><rect x="12" y="8" width="5" height="1"/><rect x="11" y="9" width="7" height="4"/><rect x="12" y="13" width="5" height="1"/><rect x="24" y="9" width="3" height="1"/><rect x="23" y="10" width="5" height="3"/><rect x="24" y="13" width="3" height="1"/><rect x="17" y="13" width="7" height="1"/></g>
<g fill="#6B4B38"><rect x="12" y="9" width="3" height="1"/><rect x="24" y="10" width="2" height="1"/></g>
<g class="{{hubL}}"><rect x="14" y="10" width="1" height="3" fill="#DDF3EC"/><rect x="13" y="11" width="3" height="1" fill="#DDF3EC"/><rect x="13" y="10" width="1" height="1" fill="#8FB8B0"/><rect x="15" y="12" width="1" height="1" fill="#8FB8B0"/></g>
<g class="{{hubR}}"><rect x="25" y="10" width="1" height="3" fill="#DDF3EC"/><rect x="24" y="11" width="3" height="1" fill="#DDF3EC"/><rect x="24" y="10" width="1" height="1" fill="#8FB8B0"/><rect x="26" y="12" width="1" height="1" fill="#8FB8B0"/></g>
<rect x="11" y="13" width="18" height="1" fill="#0F2B33" opacity="0.4"/>
<rect x="8" y="19" width="24" height="1" fill="#5D8580"/>
<rect x="7" y="20" width="26" height="1" fill="#5D8580"/>
<rect x="6" y="21" width="28" height="4" fill="#5D8580"/>
<rect x="8" y="19" width="24" height="1" fill="#7FA39D"/>
<g fill="#14232A"><rect x="10" y="22" width="2" height="2"/><rect x="28" y="22" width="2" height="2"/><rect x="15" y="22" width="1" height="1"/><rect x="24" y="22" width="1" height="1"/></g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scale":{"editor":"int","default":4,"min":1,"max":10},"playing":{"editor":"boolean","default":true},"$preview":{"width":160,"height":104}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.scale ?? 4;
const playing = this.props.playing ?? true;
return {
w: 40 * s,
h: 26 * s,
hubL: playing ? 'tape-hub-l' : 'tape-still',
hubR: playing ? 'tape-hub-r' : 'tape-still',
label: playing ? 'Cassette playing' : 'Cassette stopped'
};
}
}
</script>
</body>
</html>
